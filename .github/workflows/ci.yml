name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PY_VERSION: "3.13"
  CACHE_VERSION: 1
  GO_VERSION: "1.25"
  ACTIONLINT_VERSION: "v1.7.12"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  base:
    name: Prepare dependences
    runs-on: ubuntu-latest
    outputs:
      PY_PATH: ${{ steps.setup-outsputs.outputs.PY_PATH }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PY_VERSION}}

      - name: "Setup outputs"
        id: setup-outsputs
        run: echo "PY_PATH=${{env.pythonLocation}}" >> "$GITHUB_OUTPUT"

      - name: "Cache dependencies"
        id: cache-dependencies
        uses: actions/cache@v4.2.0
        with:
          path: ${{env.pythonLocation}}
          key: ${{ runner.os }}-pip-dependencies-${{ hashFiles('requirements_test.txt') }}_${{env.CACHE_VERSION}}

      - name: "Install dependencies"
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: pip install -r requirements_test.txt

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"

      - name: "Hassfest validation"
        uses: home-assistant/actions/hassfest@master

  black:
    name: Black codestyle
    runs-on: ubuntu-latest
    needs: base
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Restore Python
        uses: actions/cache/restore@v4.2.0
        with:
          path: ${{needs.base.outputs.PY_PATH}}
          fail-on-cache-miss: true
          key: ${{ runner.os }}-pip-dependencies-${{ hashFiles('requirements_test.txt') }}_${{env.CACHE_VERSION}}

      - name: "Black codestyle check"
        run: scripts/check.sh --python "${{needs.base.outputs.PY_PATH}}/bin/python" --only black

  codespell:
    name: "Codespell check"
    runs-on: ubuntu-latest
    needs: base
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Restore Python
        uses: actions/cache/restore@v4.2.0
        with:
          path: ${{needs.base.outputs.PY_PATH}}
          fail-on-cache-miss: true
          key: ${{ runner.os }}-pip-dependencies-${{ hashFiles('requirements_test.txt') }}_${{env.CACHE_VERSION}}

      - name: "Codespell check"
        run: scripts/check.sh --python "${{needs.base.outputs.PY_PATH}}/bin/python" --only codespell

  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    needs: base
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Restore Python
        uses: actions/cache/restore@v4.2.0
        with:
          path: ${{needs.base.outputs.PY_PATH}}
          fail-on-cache-miss: true
          key: ${{ runner.os }}-pip-dependencies-${{ hashFiles('requirements_test.txt') }}_${{env.CACHE_VERSION}}

      - name: "Pytest"
        env:
          # Coverage and output options for the CI pytest run.
          PYTEST_ADDOPTS: "--cov --disable-warnings -s"
        run: scripts/check.sh --python "${{needs.base.outputs.PY_PATH}}/bin/python" --only pytest

  repository:
    name: "Repository checks"
    runs-on: ubuntu-latest
    needs: base
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Python
        uses: actions/cache/restore@v4.2.0
        with:
          path: ${{needs.base.outputs.PY_PATH}}
          fail-on-cache-miss: true
          key: ${{ runner.os }}-pip-dependencies-${{ hashFiles('requirements_test.txt') }}_${{env.CACHE_VERSION}}

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{env.GO_VERSION}}
          cache: false

      - name: "Install actionlint and gitleaks"
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install -ldflags "-X=github.com/zricethezav/gitleaks/v8/version.Version=${GITLEAKS_VERSION}" \
            "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: "JSON, YAML, actionlint, secrets, and diff whitespace"
        env:
          # Pull request: base commit; push: previous tip; manual run: empty tree (whole tree).
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '4b825dc642cb6eb9a060e54bf8d69288fbee4904' }}
        run: >-
          scripts/check.sh --python "${{needs.base.outputs.PY_PATH}}/bin/python"
          --only json,yaml,actionlint,gitleaks,diff --diff-base "$DIFF_BASE"
