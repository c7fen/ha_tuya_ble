phase_a_status_probe:
  name: TEMPORARY RESEARCH HARNESS — DO NOT MERGE
  description: >-
    Temporary S1 Phase-A Device Status research probe. This service is not a
    product feature and this branch must be closed without merge after the
    authorized hardware inventory is complete.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options:
            - cold
            - cold_then_retained
    invocation_nonce:
      required: true
      selector:
        text:
phase_a_status_probe_preflight:
  name: TEMPORARY RESEARCH PREFLIGHT — DO NOT MERGE
  description: >-
    BLE-free Phase-A response-path preflight. It does not resolve a device,
    acquire a lease, or issue any Bluetooth request.
  fields:
    nonce:
      required: false
      selector:
        text:
phase_a_status_probe_receipt:
  name: TEMPORARY RESEARCH RECEIPT LOOKUP — DO NOT MERGE
  description: >-
    BLE-free lookup of a bounded, process-local Phase-A probe receipt. A known
    nonce is never replayed as a Device Status request.
  fields:
    nonce:
      required: true
      selector:
        text:
